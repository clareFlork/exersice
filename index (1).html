<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運動姿勢矯正平台 · Phase 0 MVP</title>
<style>
  :root {
    --bg: #12161c; --panel: #1b212a; --text: #e8edf3; --muted: #8b97a6;
    --ok: #2ecc71; --warn: #f5a623; --bad: #ff5a5f; --accent: #4da3ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid #262e39; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border-radius: 12px; padding: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type=text] { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c3541;
    background: #11161d; color: var(--text); font-size: 14px; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent);
    color: #04121f; font-weight: 700; cursor: pointer; font-size: 14px; }
  button.secondary { background: #2c3541; color: var(--text); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .video-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
    border-radius: 10px; overflow: hidden; }
  #player, #player iframe { width: 100%; height: 100%; }
  .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; text-align: center; padding: 16px; }
  #cam, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    transform: scaleX(-1); }
  .hud { display: flex; align-items: center; gap: 20px; margin-top: 14px; }
  .count { font-size: 56px; font-weight: 800; line-height: 1; min-width: 80px; }
  .count small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }
  .status { flex: 1; }
  .status .label { font-size: 28px; font-weight: 800; }
  .status .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .c-ok { color: var(--ok); } .c-warn { color: var(--warn); } .c-bad { color: var(--bad); }
  .msg { color: var(--muted); font-size: 13px; min-height: 18px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #262e39; }
  th { color: var(--muted); font-weight: 600; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .records { margin-top: 20px; }
</style>
</head>
<body>
<header>
  <h1>運動姿勢矯正平台</h1>
  <p>Phase 0 MVP · 貼上 YouTube 影片 → 開鏡頭 → 深蹲即時提示 → 自動紀錄</p>
</header>

<main>
  <div class="grid">
    <section class="panel">
      <h2>① 運動影片</h2>
      <div class="row">
        <input type="text" id="ytUrl" placeholder="貼上 YouTube 連結，例如 https://www.youtube.com/watch?v=...">
        <button id="loadBtn">載入</button>
      </div>
      <div class="video-box">
        <div id="player"></div>
        <div class="placeholder" id="ytPlaceholder">尚未載入影片（也可以不載入，直接開始偵測）</div>
      </div>
      <div class="msg" id="ytMsg"></div>
    </section>

    <section class="panel">
      <h2>② 姿勢偵測（深蹲）</h2>
      <div class="row">
        <button id="startBtn">開始運動</button>
        <button id="stopBtn" class="secondary" disabled>結束並儲存紀錄</button>
      </div>
      <div class="video-box">
        <video id="cam" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="placeholder" id="camPlaceholder">按「開始運動」後會開啟鏡頭<br>請側面對鏡頭，讓全身入鏡</div>
      </div>
      <div class="hud">
        <div class="count"><span id="count">0</span><small>次</small></div>
        <div class="status">
          <div class="label" id="label">待機中</div>
          <div class="sub" id="sub">膝角度：--°</div>
        </div>
      </div>
      <div class="msg" id="camMsg"></div>
    </section>
  </div>

  <section class="panel records">
    <h2>③ 運動紀錄</h2>
    <div id="records"></div>
  </section>
</main>

<script src="https://www.youtube.com/iframe_api"></script>
<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = (id) => document.getElementById(id);
const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
const STORAGE_KEY = "exersice_records_v1";

/* ---------- 深蹲判斷參數（依實測可調整） ---------- */
const STAND_ANGLE = 160;   // 大於此值視為站直
const DOWN_ANGLE  = 150;   // 小於此值視為開始下蹲
const TOO_SHALLOW = 100;   // 最低點膝角度 > 100° → 太淺
const TOO_DEEP    = 70;    // 最低點膝角度 < 70°  → 太深
const MIN_VISIBILITY = 0.5;
const SMOOTH_N = 5;

/* ---------- 1. YouTube ---------- */
let ytPlayer = null;
let ytApiReady = !!(window.YT && window.YT.Player);
window.onYouTubeIframeAPIReady = () => { ytApiReady = true; };

function extractVideoId(url) {
  const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}

$("loadBtn").addEventListener("click", () => {
  const id = extractVideoId($("ytUrl").value.trim());
  if (!id) { $("ytMsg").textContent = "找不到有效的 YouTube 影片 ID，請確認連結。"; return; }
  if (!ytApiReady && !(window.YT && window.YT.Player)) {
    $("ytMsg").textContent = "YouTube 播放器還在載入，請稍後再按一次。"; return;
  }
  $("ytMsg").textContent = "";
  $("ytPlaceholder").style.display = "none";
  if (ytPlayer) {
    ytPlayer.loadVideoById(id);
  } else {
    ytPlayer = new YT.Player("player", {
      videoId: id,
      playerVars: { rel: 0, playsinline: 1 },
      events: { onError: () => { $("ytMsg").textContent = "影片無法播放（可能禁止嵌入）。"; } }
    });
  }
});

function currentVideoTitle() {
  try {
    const t = ytPlayer && ytPlayer.getVideoData && ytPlayer.getVideoData().title;
    if (t) return t;
  } catch (e) {}
  return "（未載入影片）";
}

/* ---------- 2. 深蹲偵測邏輯 ---------- */
function angle(a, b, c) {
  const ab = { x: a.x - b.x, y: a.y - b.y };
  const cb = { x: c.x - b.x, y: c.y - b.y };
  const mag = Math.hypot(ab.x, ab.y) * Math.hypot(cb.x, cb.y);
  if (mag === 0) return 180;
  const cos = Math.max(-1, Math.min(1, (ab.x * cb.x + ab.y * cb.y) / mag));
  return Math.acos(cos) * 180 / Math.PI;
}

function classify(a) {
  if (a > TOO_SHALLOW) return { key: "shallow", text: "太淺", cls: "c-warn" };
  if (a < TOO_DEEP)    return { key: "deep",    text: "太深", cls: "c-bad" };
  return { key: "good", text: "恰好", cls: "c-ok" };
}

const squat = {
  state: "up", count: 0, minAngle: 180, buf: [],
  reset() { this.state = "up"; this.count = 0; this.minAngle = 180; this.buf = []; },
  smooth(a) {
    this.buf.push(a);
    if (this.buf.length > SMOOTH_N) this.buf.shift();
    return this.buf.reduce((s, v) => s + v, 0) / this.buf.length;
  },
  // 回傳 { angle, live, repResult }
  update(rawAngle) {
    const a = this.smooth(rawAngle);
    let repResult = null;
    if (this.state === "up" && a < DOWN_ANGLE) { this.state = "down"; this.minAngle = a; }
    if (this.state === "down") {
      this.minAngle = Math.min(this.minAngle, a);
      if (a > STAND_ANGLE) {
        this.state = "up";
        this.count++;
        repResult = classify(this.minAngle);
      }
    }
    const live = this.state === "down" ? classify(this.minAngle) : null;
    return { angle: a, live, repResult };
  }
};

/* ---------- 3. 鏡頭 + 骨架 ---------- */
const cam = $("cam");
const canvas = $("overlay");
const ctx = canvas.getContext("2d");
let poseLandmarker = null, drawing = null, stream = null;
let running = false, lastVideoTime = -1, sessionStart = null;
let lastRep = null;
const repStats = { good: 0, shallow: 0, deep: 0 };

async function initPose() {
  if (poseLandmarker) return;
  const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
  poseLandmarker = await PoseLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" },
    runningMode: "VIDEO",
    numPoses: 1
  });
  drawing = new DrawingUtils(ctx);
}

function setLabel(text, cls, sub) {
  const el = $("label");
  el.textContent = text;
  el.className = "label " + (cls || "");
  if (sub !== undefined) $("sub").textContent = sub;
}

function pickSide(lm) {
  const vis = (idx) => idx.reduce((s, i) => s + (lm[i].visibility ?? 0), 0) / idx.length;
  const left = [23, 25, 27], right = [24, 26, 28];
  const idx = vis(left) >= vis(right) ? left : right;
  return { idx, vis: vis(idx) };
}

function loop() {
  if (!running) return;
  if (cam.readyState >= 2 && cam.currentTime !== lastVideoTime) {
    lastVideoTime = cam.currentTime;
    if (canvas.width !== cam.videoWidth) { canvas.width = cam.videoWidth; canvas.height = cam.videoHeight; }
    const result = poseLandmarker.detectForVideo(cam, performance.now());
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (result.landmarks && result.landmarks.length) {
      const lm = result.landmarks[0];
      drawing.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color: "#4da3ff", lineWidth: 3 });
      drawing.drawLandmarks(lm, { color: "#ffffff", fillColor: "#ff5a5f", radius: 4 });

      const { idx, vis } = pickSide(lm);
      if (vis < MIN_VISIBILITY) {
        setLabel("請側身並讓全身入鏡", "c-warn", "膝角度：--°");
      } else {
        const raw = angle(lm[idx[0]], lm[idx[1]], lm[idx[2]]);
        const r = squat.update(raw);
        $("count").textContent = squat.count;
        if (r.repResult) {
          lastRep = r.repResult;
          repStats[r.repResult.key]++;
        }
        const subText = `膝角度：${Math.round(r.angle)}°` + (lastRep ? `　上一次：${lastRep.text}` : "");
        if (r.live) setLabel(r.live.text, r.live.cls, subText);
        else if (lastRep) setLabel(`上一次：${lastRep.text}`, lastRep.cls, subText);
        else setLabel("站立中，請開始深蹲", "", subText);
      }
    } else {
      setLabel("未偵測到人體", "c-warn", "膝角度：--°");
    }
  }
  requestAnimationFrame(loop);
}

$("startBtn").addEventListener("click", async () => {
  $("startBtn").disabled = true;
  $("camMsg").textContent = "載入姿勢模型與開啟鏡頭中…";
  try {
    await initPose();
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: false
    });
    cam.srcObject = stream;
    await cam.play();
  } catch (err) {
    console.error(err);
    $("camMsg").textContent = "無法啟動：" + (err.name === "NotAllowedError"
      ? "請允許瀏覽器使用鏡頭。" : (err.message || err));
    $("startBtn").disabled = false;
    return;
  }
  $("camMsg").textContent = "";
  $("camPlaceholder").style.display = "none";
  squat.reset(); lastRep = null; lastVideoTime = -1;
  repStats.good = repStats.shallow = repStats.deep = 0;
  $("count").textContent = "0";
  setLabel("站立中，請開始深蹲", "", "膝角度：--°");
  sessionStart = new Date();
  running = true;
  $("stopBtn").disabled = false;
  loop();
});

$("stopBtn").addEventListener("click", () => {
  running = false;
  if (stream) stream.getTracks().forEach((t) => t.stop());
  cam.srcObject = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  $("camPlaceholder").style.display = "flex";

  saveRecord({
    date: (sessionStart || new Date()).toISOString(),
    video: currentVideoTitle(),
    reps: squat.count,
    good: repStats.good, shallow: repStats.shallow, deep: repStats.deep
  });
  setLabel("已結束，紀錄已儲存", "c-ok", `本次共完成 ${squat.count} 次`);
  $("startBtn").disabled = false;
  $("stopBtn").disabled = true;
});

/* ---------- 4. 紀錄（localStorage） ---------- */
function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch (e) { return []; }
}
function saveRecord(rec) {
  const all = loadRecords();
  all.unshift(rec);
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(all)); }
  catch (e) { $("camMsg").textContent = "紀錄無法儲存（瀏覽器儲存空間被封鎖）。"; }
  renderRecords();
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function renderRecords() {
  const all = loadRecords();
  const box = $("records");
  if (!all.length) { box.innerHTML = '<div class="empty">還沒有紀錄，完成一次運動後會出現在這裡。</div>'; return; }
  box.innerHTML = "<table><thead><tr><th>日期</th><th>影片名稱</th><th>完成次數</th><th>恰好 / 太淺 / 太深</th></tr></thead><tbody>" +
    all.map((r) => `<tr>
      <td>${esc(new Date(r.date).toLocaleString("zh-TW", { hour12: false }))}</td>
      <td>${esc(r.video)}</td>
      <td>${esc(r.reps)}</td>
      <td>${esc(r.good)} / ${esc(r.shallow)} / ${esc(r.deep)}</td></tr>`).join("") +
    "</tbody></table>";
}
renderRecords();
</script>
</body>
</html>
